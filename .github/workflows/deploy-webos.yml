name: Deploy WebOS to Firebase Hosting

# Auto-builds and deploys NovAura-WebOS (the /os/ + landing bundles) to the
# live Firebase Hosting site (novaura-life-8df2f) on every push to the
# branches below. See NovAura-WebOS/DEPLOY_SETUP.md for the one-time secret setup.

on:
  push:
    branches:
      - master
      - main
      - claude/site-work-direct-qk2OQ
    paths:
      - 'NovAura-WebOS/**'
      - '.github/workflows/deploy-webos.yml'
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NovAura-WebOS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NovAura-WebOS/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build (OS + landing)
        env:
          # Public Firebase web config — safe to expose (ships in the client bundle).
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FCM_OAUTH_CLIENT_ID: ${{ secrets.VITE_FCM_OAUTH_CLIENT_ID }}
          VITE_FCM_SENDER_ID: ${{ secrets.VITE_FCM_SENDER_ID }}
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: novaura-life
          channelId: live
          entryPoint: ./NovAura-WebOS
